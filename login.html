<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Yuvraj Medical Store</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Header -->
    <header>

        <h1>Yuvraj Medical Store</h1>

        <p>Established in 2010</p>

    </header>


    <!-- Navigation -->
    <nav>

        <a href="index.html">Home</a>

        <a href="products.html">Products</a>

        <a href="about.html">About Us</a>

        <a href="contact.html">Contact Us</a>

        <a href="login.html">Login</a>

        <a href="cart.html">Cart</a>

    </nav>


    <!-- Login Section -->
    <main>

        <section>

            <h2>Customer Login</h2>

            <form>

                <label>Email:</label><br>

                <input type="email"
                       placeholder="Enter your email"
                       required>

                <br><br>


                <label>Password:</label><br>

                <input type="password"
                       placeholder="Enter your password"
                       required>

                <br><br>


                <button type="submit">
                    Login
                </button>

            </form>

        </section>


        <!-- Register Section -->
        <section>

            <h2>Create New Account</h2>

            <form>

                <label>Full Name:</label><br>

                <input type="text"
                       placeholder="Enter your full name"
                       required>

                <br><br>


                <label>Email:</label><br>

                <input type="email"
                       placeholder="Enter your email"
                       required>

                <br><br>


                <label>Mobile Number:</label><br>

                <input type="tel"
                       placeholder="Enter mobile number"
                       required>

                <br><br>


                <label>Password:</label><br>

                <input type="password"
                       placeholder="Create password"
                       required>

                <br><br>


                <button type="submit">
                    Register
                </button>

            </form>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Yuvraj Medical Store.
            All Rights Reserved.
        </p>

    </footer>

</body>

</html>
